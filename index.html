<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Official website of SYLASO. Discover the latest music, videos, biography, and booking information.">
  <title>SYLASO | Official Artist Website</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080808;
      --surface: #111111;
      --surface-2: #191919;
      --gold: #d6ae62;
      --text: #f7f5f0;
      --muted: #999999;
      --border: rgba(255,255,255,.10);
      --radius: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, textarea {
      font: inherit;
    }

    img {
      display: block;
      width: 100%;
      object-fit: cover;
    }

    .container {
      width: min(1160px, 90%);
      margin-inline: auto;
    }

    .gold { color: var(--gold); }

    .eyebrow {
      color: var(--gold);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1, h2, h3, .logo {
      font-family: "Oswald", sans-serif;
      text-transform: uppercase;
      line-height: 1.1;
    }

    h2 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: 1px;
    }

    .section {
      padding: 100px 0;
    }

    .section-heading {
      margin-bottom: 42px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 550px;
      margin-top: 14px;
    }

    /* NAVIGATION */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,8,8,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      min-height: 76px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: #d2d2d2;
      font-size: .85rem;
      transition: color .2s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .menu-toggle {
      display: none;
      border: 1px solid var(--border);
      color: white;
      background: var(--surface);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* BUTTONS */

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 13px 23px;
      border-radius: 4px;
      border: 1px solid var(--gold);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background: var(--gold);
      color: #090909;
    }

    .btn-outline {
      color: var(--text);
      background: transparent;
    }

    .btn-outline:hover {
      background: var(--gold);
      color: #090909;
    }

    /* HERO */

    .hero {
      min-height: 680px;
      min-height: min(800px, 88svh);
      display: flex;
      align-items: center;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(0,0,0,.96) 0%,
        rgba(0,0,0,.76) 48%, rgba(0,0,0,.22) 100%),
        linear-gradient(0deg, var(--bg), transparent 30%),
        url("profile.jpg")
        center 40% / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at 75% 45%,
        rgba(214,174,98,.13), transparent 50%);
    }
